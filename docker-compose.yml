services:
  file-server:
    image: nginx:alpine
    container_name: file-server
    ports:
      - "${HTTP_PORT}:80"
    env_file: .env
    volumes:
      - ./nginx/firmware.conf:/etc/nginx/conf.d/firmware.conf:ro
      - ./nginx/htpasswd:/etc/nginx/.htpasswd:ro
      - ./data/firmware:/usr/share/nginx/html/firmware
    command: >
      sh -c "chown -R 101:101 /usr/share/nginx/html/firmware &&
             nginx -g 'daemon off;'"
    restart: unless-stopped
